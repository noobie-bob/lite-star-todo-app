name: CI Pipeline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # Allow this workflow to be called by other workflows
  workflow_run:
    workflows: ["Fast Checks & Auto-fix"]
    types: [completed]

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Wait for fast-checks to complete (only for PRs)
  wait-for-fast-checks:
    name: Wait for Fast Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Wait for fast-checks workflow
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.pull_request.head.sha;

            console.log(`Waiting for fast-checks workflow on commit ${ref}`);

            // Wait up to 10 minutes for fast-checks to complete
            const maxWaitTime = 10 * 60 * 1000; // 10 minutes
            const pollInterval = 10000; // 10 seconds
            const startTime = Date.now();

            while (Date.now() - startTime < maxWaitTime) {
              // Get all workflow runs for this commit
              const { data: workflowRuns } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: ref,
                per_page: 100
              });

              // Find the fast-checks workflow
              const fastChecksRun = workflowRuns.workflow_runs.find(
                run => run.name === 'Fast Checks & Auto-fix'
              );

              if (fastChecksRun) {
                console.log(`Fast-checks status: ${fastChecksRun.status} (${fastChecksRun.conclusion})`);

                if (fastChecksRun.status === 'completed') {
                  if (fastChecksRun.conclusion === 'success') {
                    console.log('✅ Fast-checks completed successfully');
                    return;
                  } else if (fastChecksRun.conclusion === 'failure') {
                    console.log('❌ Fast-checks failed - continuing with CI anyway');
                    return;
                  } else {
                    console.log(`⚠️ Fast-checks completed with status: ${fastChecksRun.conclusion}`);
                    return;
                  }
                }
              }

              // Wait before polling again
              await new Promise(resolve => setTimeout(resolve, pollInterval));
            }

            console.log('⏱️ Timeout waiting for fast-checks - continuing with CI');

      - name: Check for new commits
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            // Get the latest PR data
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });

            const currentSha = context.payload.pull_request.head.sha;
            const latestSha = pr.head.sha;

            if (currentSha !== latestSha) {
              console.log(`New commits detected. Current: ${currentSha}, Latest: ${latestSha}`);
              console.log('This workflow run is outdated and will be cancelled by concurrency group');
              core.setFailed('Outdated - new commits pushed');
            } else {
              console.log('No new commits - proceeding with CI');
            }

  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    needs: [wait-for-fast-checks]
    if: |
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && needs.wait-for-fast-checks.result != 'failure'))
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit
        id: precommit
        continue-on-error: true
        run: |
          echo "Running pre-commit on all files..."
          pre-commit run --all-files --show-diff-on-failure

      # Case 1: Pre-commit passed - continue with rest of checks
      - name: Pre-commit passed
        if: steps.precommit.outcome == 'success'
        run: |
          echo "✅ Pre-commit checks passed. Continuing with remaining checks."

      # Case 2: Pre-commit failed - check for file changes
      - name: Restore workflow files
        if: steps.precommit.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "Restoring .github/workflows/ to prevent unauthorized modifications..."
          git restore .github/workflows/ 2>/dev/null || echo "No workflow files to restore"

      - name: Check for non-workflow file changes
        id: check_changes
        if: steps.precommit.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No file changes detected (only workflow files were modified)"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "File changes detected:"
            git diff --stat
          fi

      # Case 2a: Only workflow files modified - ask user to fix manually
      - name: Notify user - workflow files modified
        if: |
          steps.precommit.outcome == 'failure' &&
          steps.check_changes.outputs.has_changes == 'false' &&
          github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔒 Workflow Files Modified - Manual Fix Required

            **Pre-commit detected issues in \`.github/workflows/\` files.**

            For security reasons, CI cannot automatically modify workflow files. These files control the CI/CD pipeline and could be exploited if modified by automated systems.

            ### What you need to do:

            1. **Run pre-commit locally:**
               ~~~bash
               # Install pre-commit
               pip install pre-commit
               pre-commit install

               # Run on all files
               pre-commit run --all-files

               # Review the changes in .github/workflows/
               git diff .github/workflows/

               # If the changes are correct, commit them
               git add .github/workflows/
               git commit -m "fix: resolve pre-commit issues in workflow files"
               git push
               ~~~

            2. **Review the changes carefully** before committing workflow file modifications

            3. **Alternative**: If you don't want to modify workflow files, you can:
               - Exclude them from pre-commit checks
               - Ask a maintainer to review and fix them

            ### Why this restriction exists:
            - 🔒 Prevents potential CI/CD pipeline exploitation
            - 🛡️ Workflow files control what code runs in CI
            - ✅ Manual review ensures security

            After fixing locally, push your changes and this check will re-run.`
            })

      - name: Fail - workflow files need manual fix
        if: |
          steps.precommit.outcome == 'failure' &&
          steps.check_changes.outputs.has_changes == 'false' &&
          github.event_name == 'pull_request'
        run: |
          echo "::error::Pre-commit failed with workflow file modifications. Manual fix required."
          exit 1

      # Case 2b: Non-workflow files modified - auto-commit them
      - name: Commit non-workflow auto-fixes
        if: |
          steps.precommit.outcome == 'failure' &&
          steps.check_changes.outputs.has_changes == 'true' &&
          github.event_name == 'pull_request'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: auto-fix pre-commit issues"
          echo "✅ Local commit created (not pushed yet)"

      - name: Verify auto-fixes
        id: verify
        if: |
          steps.precommit.outcome == 'failure' &&
          steps.check_changes.outputs.has_changes == 'true' &&
          github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          echo "Re-running pre-commit to verify fixes..."
          pre-commit run --all-files --show-diff-on-failure

      - name: Push auto-fixes to PR
        if: |
          steps.precommit.outcome == 'failure' &&
          steps.check_changes.outputs.has_changes == 'true' &&
          steps.verify.outcome == 'success' &&
          github.event_name == 'pull_request'
        run: |
          echo "✅ Verification passed. Pushing auto-fixes to PR..."
          git push origin HEAD:${{ github.head_ref }}

      - name: Notify user about successful auto-fix
        if: |
          steps.precommit.outcome == 'failure' &&
          steps.check_changes.outputs.has_changes == 'true' &&
          steps.verify.outcome == 'success' &&
          github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ Pre-commit Auto-fix Applied

            **Pre-commit hooks have automatically fixed issues in your code.**

            ### What happened?
            - 🔧 Pre-commit ran and fixed auto-fixable issues
            - 🔒 Workflow files were NOT modified (security protection)
            - ✅ Changes have been verified and pushed to your PR
            - 🔄 CI checks are restarting automatically

            ### What you need to do:
            Please pull the latest changes to your local branch:
            ~~~bash
            git pull --rebase
            ~~~

            ### Next steps:
            - Your PR has been updated with the fixes
            - Both fast-checks and CI workflows will restart
            - All checks should pass now ✨`
            })

      - name: Job terminates after auto-fix
        if: |
          steps.precommit.outcome == 'failure' &&
          steps.check_changes.outputs.has_changes == 'true' &&
          steps.verify.outcome == 'success' &&
          github.event_name == 'pull_request'
        run: |
          echo "✅ Auto-fix completed and pushed. Terminating job to allow workflow restart."
          echo "The push will trigger both fast-checks and CI workflows to restart."
          exit 0

      - name: Notify user - verification failed
        if: |
          steps.precommit.outcome == 'failure' &&
          steps.check_changes.outputs.has_changes == 'true' &&
          steps.verify.outcome == 'failure' &&
          github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚠️ Pre-commit Auto-fix Failed Verification

            **Pre-commit made some fixes but verification still failed.**

            This means there are issues that cannot be auto-fixed and require manual intervention.

            ### What you need to do:

            ~~~bash
            # Install pre-commit
            pip install pre-commit
            pre-commit install

            # Run on all files
            pre-commit run --all-files

            # Review errors and fix them manually
            git diff

            # Commit the fixes
            git add .
            git commit -m "fix: resolve pre-commit issues"
            git push
            ~~~

            ### Need help?
            Check the pre-commit output above for specific errors, or ask a maintainer for assistance.`
            })

      - name: Fail - verification failed
        if: |
          steps.precommit.outcome == 'failure' &&
          steps.check_changes.outputs.has_changes == 'true' &&
          steps.verify.outcome == 'failure' &&
          github.event_name == 'pull_request'
        run: |
          echo "::error::Pre-commit verification failed. Manual fix required."
          exit 1

      - name: Fail on push events if pre-commit failed
        if: steps.precommit.outcome == 'failure' && github.event_name == 'push'
        run: |
          echo "::error::Pre-commit checks failed on push to protected branch."
          echo "::error::Please run 'pre-commit run --all-files' locally and commit the fixes before pushing."
          exit 1

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    needs: [pre-commit]
    if: |
      always() &&
      (needs.pre-commit.result == 'success' || needs.pre-commit.result == 'skipped')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          python -m pip install -U pip uv
          uv sync --no-dev --extra mypy --system

      - name: Run mypy with annotations
        run: |
          echo '::add-matcher::.github/workflows/mypy-matcher.json'
          mypy --show-error-codes --show-column-numbers src
          echo '::remove-matcher owner=mypy::'

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [pre-commit]
    if: |
      always() &&
      (needs.pre-commit.result == 'success' || needs.pre-commit.result == 'skipped')
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-py${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install -U pip uv
          uv sync --group tests --system --no-dev

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [pre-commit]
    if: |
      always() &&
      (needs.pre-commit.result == 'success' || needs.pre-commit.result == 'skipped')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install security tools
        run: python -m pip install bandit[toml] safety pip-audit

      - name: Run bandit security scan
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Run pip-audit
        run: pip-audit --require-hashes --disable-pip || true

      - name: Run safety check
        run: safety check --json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json

  # dependency-review:
  #   name: Dependency Review
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'pull_request'
  #   needs: [pre-commit]
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v6.0.1

  #     - name: Dependency Review
  #       uses: actions/dependency-review-action@v4
  #       with:
  #         fail-on-severity: moderate

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [pre-commit, type-check, test]
    if: |
      always() &&
      needs.pre-commit.result == 'success' &&
      needs.type-check.result == 'success' &&
      needs.test.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  all-checks-pass:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [pre-commit, type-check, test, security, build]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ Some checks failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "⚠️ Some checks were cancelled"
            exit 1
          else
            echo "✅ All checks passed"
          fi
