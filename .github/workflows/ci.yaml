name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
        with:
          # For PRs, fetch the latest commit (after potential auto-fix from fast-checks)
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit (first attempt)
        id: precommit_first
        continue-on-error: true
        run: |
          echo "Running pre-commit on all files..."
          pre-commit run --all-files --show-diff-on-failure

      - name: Check for changes after first run
        id: changes_first
        if: steps.precommit_first.outcome == 'failure'
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected after pre-commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected after pre-commit:"
            git diff --stat
          fi

      - name: Commit pre-commit auto-fixes
        if: steps.precommit_first.outcome == 'failure' && steps.changes_first.outputs.changed == 'true' && github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v7.1.0
        with:
          commit_message: "style: auto-fix pre-commit issues"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Fail on push events if pre-commit made changes
        if: steps.precommit_first.outcome == 'failure' && steps.changes_first.outputs.changed == 'true' && github.event_name == 'push'
        run: |
          echo "::error::Pre-commit checks failed on push to protected branch. Pre-commit hooks must be run before pushing."
          echo "::error::Please run 'pre-commit run --all-files' locally and commit the fixes."
          exit 1

      - name: Run pre-commit (second attempt - verification)
        id: precommit_second
        if: steps.precommit_first.outcome == 'failure' && steps.changes_first.outputs.changed == 'true'
        continue-on-error: true
        run: |
          echo "Re-running pre-commit to verify fixes..."
          pre-commit run --all-files --show-diff-on-failure

      - name: Notify user about successful auto-fix
        if: steps.precommit_first.outcome == 'failure' && steps.changes_first.outputs.changed == 'true' && steps.precommit_second.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ Pre-commit Auto-fix Applied
            
            **Pre-commit hooks have automatically fixed issues.**
            
            ### What happened?
            - 🔧 Pre-commit hooks ran and fixed auto-fixable issues
            - ✅ Changes have been committed to your PR branch
            
            ### What you need to do:
            Please pull the latest changes to your local branch:
            \`\`\`bash
            git pull --rebase
            \`\`\`
            
            ### Next steps:
            - Your PR has been updated with the fixes
            - The CI pipeline will continue with the remaining checks
            - All checks should pass now ✨`
            })

      - name: Notify user about manual fix needed
        if: steps.precommit_first.outcome == 'failure' && (steps.changes_first.outputs.changed == 'false' || steps.precommit_second.outcome == 'failure') && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚠️ Pre-commit Checks Failed - Manual Fix Required
            
            **Some pre-commit issues require manual intervention.**
            
            ### What you need to do:
            
            #### Option 1: Install and run pre-commit locally (Recommended)
            \`\`\`bash
            # Install pre-commit
            pip install pre-commit
            
            # Install the git hooks
            pre-commit install
            
            # Run on all files
            pre-commit run --all-files
            
            # Review the changes
            git diff
            
            # Commit the fixes
            git add .
            git commit -m "fix: resolve pre-commit issues"
            git push
            \`\`\`
            
            #### Option 2: Quick fix (if you don't want to install pre-commit)
            \`\`\`bash
            # Format code
            ruff format .
            
            # Fix linting issues
            ruff check --fix .
            
            # Run mypy
            mypy src
            
            # Commit and push
            git add .
            git commit -m "fix: resolve linting and type issues"
            git push
            \`\`\`
            
            ### Why pre-commit is recommended:
            - ⚡ Catches issues before you push
            - 🔧 Auto-fixes most formatting issues
            - 🛡️ Includes security checks (gitleaks)
            - ✅ Ensures consistency across the team
            
            ### Need help?
            Check the pre-commit output above for specific errors, or ask a maintainer for assistance.`
            })

      - name: Fail if pre-commit issues remain
        if: steps.precommit_first.outcome == 'failure' && (steps.changes_first.outputs.changed == 'false' || steps.precommit_second.outcome == 'failure')
        run: |
          echo "::error::Pre-commit checks failed and could not be auto-fixed. Please fix manually."
          exit 1

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          python -m pip install -U pip uv
          uv sync --no-dev

      - name: Install mypy
        run: uv pip install mypy types-requests

      - name: Run mypy with annotations
        run: |
          echo '::add-matcher::.github/mypy-matcher.json'
          uv run mypy --show-error-codes --show-column-numbers src
          echo '::remove-matcher owner=mypy::'

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-py${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install -U pip uv
          uv sync

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install security tools
        run: python -m pip install bandit[toml] safety pip-audit

      - name: Run bandit security scan
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Run pip-audit
        run: pip-audit --require-hashes --disable-pip || true

      - name: Run safety check
        run: safety check --json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: pre-commit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [pre-commit, type-check, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  all-checks-pass:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [pre-commit, type-check, test, security, build]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ Some checks failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "⚠️ Some checks were cancelled"
            exit 1
          else
            echo "✅ All checks passed"
          fi