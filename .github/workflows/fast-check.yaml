name: Fast Checks & Auto-fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Only run the most recent workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff-auto-fix:
    name: Ruff Format & Lint Auto-fix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
        with:
          # Important: use the PR head ref to commit back to the PR branch
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run ruff format
        id: format
        run: |
          echo "Running ruff format..."
          ruff format .
          echo "format_done=true" >> "$GITHUB_OUTPUT"

      - name: Run ruff check with auto-fix
        id: lint
        run: |
          echo "Running ruff check --fix..."
          ruff check --fix --output-format=github .
          echo "lint_done=true" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --stat
          fi

      - name: Commit auto-fixes
        if: steps.changes.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7.1.0
        with:
          commit_message: "style: auto-fix ruff format and lint issues"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Notify user about auto-fix
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `
                  ## ✅ Auto-fix Applied

                  **Ruff has automatically fixed formatting and linting issues.**

                  ### What happened?
                  - 🎨 Code formatting applied (`ruff format`)
                  - 🔧 Auto-fixable lint issues resolved (`ruff check --fix`)

                  ### What you need to do:
                  Please pull the latest changes to your local branch:
                  ```bash
                  git pull --rebase
                  ```

                  ### Next steps:
                  - The CI pipeline will now run pre-commit checks and tests
                  - If all checks pass, your PR will be ready for review
                `,
              })
      - name: Re-run format check
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "Verifying format after auto-fix..."
          ruff format --check .

      - name: Re-run lint check
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "Verifying lint after auto-fix..."
          ruff check --output-format=github .

      - name: Format check (no changes case)
        if: steps.changes.outputs.changed == 'false'
        run: |
          if ! ruff format --check .; then
            echo "::error::Format check failed but no changes were made. This shouldn't happen."
            exit 1
          fi

      - name: Lint check (no changes case)
        if: steps.changes.outputs.changed == 'false'
        run: |
          if ! ruff check --output-format=github .; then
            echo "::error::Lint check failed after auto-fix. Manual intervention required."
            exit 1
          fi

      - name: Notify user about auto-fix
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `
            ## ⚠️ Auto-fix Failed

            **Some issues require manual intervention.**

            ### What you need to do:
            Please run the following commands locally:
            ```bash
            # Format your code
            ruff format .

            # Fix linting issues
            ruff check --fix .

            # Check for remaining issues
            ruff check .

            # Commit and push
            git add .
            git commit -m "fix: resolve ruff format and lint issues"
            git push
            ```

            ### Alternative: Use pre-commit hooks
            Install pre-commit hooks to catch these issues before pushing:
            ```bash
            pip install pre-commit
            pre-commit install
            pre-commit run --all-files
            ```

            After fixing locally, push your changes and this check will re-run automatically.
            `,
              })
