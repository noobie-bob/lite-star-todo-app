name: Fast Checks & Auto-fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Only run the most recent workflow for this PR
concurrency:
  group: fast-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff-auto-fix:
    name: Ruff Format & Lint Auto-fix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run ruff format
        id: format
        run: |
          echo "Running ruff format..."
          ruff format .
          echo "format_done=true" >> "$GITHUB_OUTPUT"

      - name: Run ruff check with auto-fix
        id: lint
        run: |
          echo "Running ruff check --fix..."
          ruff check --fix --output-format=github .
          echo "lint_done=true" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --stat
          fi

      - name: Commit changes locally (not pushed yet)
        id: local_commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: auto-fix ruff format and lint issues"
          echo "Local commit created, not pushed yet"

      - name: Re-run format check
        id: format_verify
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: |
          echo "Verifying format after auto-fix..."
          ruff format --check .

      - name: Re-run lint check
        id: lint_verify
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: |
          echo "Verifying lint after auto-fix..."
          ruff check --output-format=github .

      - name: Push auto-fixes to PR
        if: |
          steps.changes.outputs.changed == 'true' && 
          steps.format_verify.outcome == 'success' && 
          steps.lint_verify.outcome == 'success'
        run: |
          echo "Ruff fixes verified successfully, pushing to PR..."
          git push origin HEAD:${{ github.head_ref }}

      - name: Trigger workflow restart after auto-fix
        if: |
          steps.changes.outputs.changed == 'true' && 
          steps.format_verify.outcome == 'success' && 
          steps.lint_verify.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Wait for push to be processed
            await new Promise(resolve => setTimeout(resolve, 3000));
            
            // The push itself will trigger workflow restart via 'synchronize' event
            console.log('Auto-fix pushed successfully. Workflows will restart automatically.');

      - name: Notify user about auto-fix
        if: |
          steps.changes.outputs.changed == 'true' && 
          steps.format_verify.outcome == 'success' && 
          steps.lint_verify.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ Auto-fix Applied

            **Ruff has automatically fixed formatting and linting issues.**

            ### What happened?
            - 🎨 Code formatting applied (ruff format)
            - 🔧 Auto-fixable lint issues resolved (ruff check --fix)
            - ✅ Changes verified and pushed to your PR
            - 🔄 CI checks will restart automatically

            ### What you need to do:
            Please pull the latest changes to your local branch:
            ~~~bash
            git pull --rebase
            ~~~

            ### Next steps:
            - The CI pipeline is restarting with the fixed code
            - If all checks pass, your PR will be ready for review`
            })

      - name: Format check (no changes case)
        if: steps.changes.outputs.changed == 'false'
        run: |
          if ! ruff format --check .; then
            echo "::error::Format check failed but no changes were made. This shouldn't happen."
            exit 1
          fi

      - name: Lint check (no changes case)
        if: steps.changes.outputs.changed == 'false'
        run: |
          if ! ruff check --output-format=github .; then
            echo "::error::Lint check failed but could not be auto-fixed. Manual intervention required."
            exit 1
          fi

      - name: Notify user about verification failure
        if: |
          failure() && 
          steps.changes.outputs.changed == 'true' && 
          (steps.format_verify.outcome == 'failure' || steps.lint_verify.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚠️ Ruff Auto-fix Failed Verification

            **Ruff made changes but verification still failed.**

            This means ruff fixed some issues but others remain that cannot be auto-fixed.

            ### What you need to do:
            Please run the following commands locally:
            ~~~bash
            # Format your code
            ruff format .

            # Fix linting issues
            ruff check --fix .

            # Check for remaining issues
            ruff check .

            # Fix any remaining issues manually, then commit
            git add .
            git commit -m "fix: resolve ruff format and lint issues"
            git push
            ~~~

            ### Need help?
            Check the ruff output above for specific errors that need manual fixing.`
            })

      - name: Notify user about manual fix needed
        if: failure() && steps.changes.outputs.changed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚠️ Auto-fix Failed

            **Some issues require manual intervention.**

            ### What you need to do:
            Please run the following commands locally:
            ~~~bash
            # Format your code
            ruff format .

            # Fix linting issues
            ruff check --fix .

            # Check for remaining issues
            ruff check .

            # Commit and push
            git add .
            git commit -m "fix: resolve ruff format and lint issues"
            git push
            ~~~

            ### Alternative: Use pre-commit hooks
            Install pre-commit hooks to catch these issues before pushing:
            ~~~bash
            pip install pre-commit
            pre-commit install
            pre-commit run --all-files
            ~~~

            After fixing locally, push your changes and this check will re-run automatically.`
            })

      # Signal completion for workflow dependencies
      - name: Mark fast-checks complete
        if: always()
        run: |
          echo "Fast checks completed with status: ${{ job.status }}"
          if [[ "${{ job.status }}" != "success" ]]; then
            exit 1
          fi