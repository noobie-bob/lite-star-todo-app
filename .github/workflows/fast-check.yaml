name: Fast Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Only run the most recent workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-lint:
    name: Quick Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install ruff
        run: python -m pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Run linter
        run: ruff check --output-format=github .

      - name: Comment on PR if formatting needed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Formatting issues detected**\n\nPlease run:\n```bash\nruff format .\nruff check --fix .\n```\n\nOr install pre-commit hooks:\n```bash\npre-commit install\npre-commit run --all-files\n```'
            })
